<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Nitin Yadav — Developer</title><desc id="desc">Animated blue and cyan developer banner.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".52" stop-color="#102b55"/><stop offset="1" stop-color="#063c4a"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6ee7f9" stroke-opacity=".09"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1000" height="260" rx="22" fill="url(#bg)"/><rect width="1000" height="260" rx="22" fill="url(#grid)"/>
<circle cx="825" cy="72" r="100" fill="#0ea5e9" opacity=".17" filter="url(#blur)"><animate attributeName="cx" values="825;760;825" dur="8s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="url(#glow)" stroke-width="1.4" opacity=".55">
 <path d="M0 200H180L205 175H300"><animate attributeName="stroke-dasharray" values="0 500;500 0" dur="5s" repeatCount="indefinite"/></path>
 <path d="M720 0V35L760 75H1000"/><path d="M770 260V220L815 175H1000"/>
 <circle cx="720" cy="35" r="4" fill="#22d3ee"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="815" cy="175" r="4" fill="#818cf8"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>
</g>
<g font-family="monospace" font-size="13" fill="#67e8f9" opacity=".72">
 <text x="45" y="48">&lt;developer_profile /&gt;</text>
 <text x="760" y="50">const build = () =&gt; {</text>
 <text x="790" y="70">learn(); ship(); repeat();</text>
 <text x="760" y="90">}</text>
</g>
<text x="500" y="112" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="750" letter-spacing="2">NITIN YADAV</text>
<rect x="270" y="130" width="460" height="2" rx="1" fill="url(#glow)"><animate attributeName="width" values="120;460;120" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="440;270;440" dur="4s" repeatCount="indefinite"/></rect>
<text x="500" y="164" text-anchor="middle" fill="#bae6fd" font-family="Segoe UI,Arial,sans-serif" font-size="18">MERN STACK DEVELOPER • AI • CLOUD</text>
<text x="500" y="196" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Jaipur, Rajasthan, India</text>
<g transform="translate(420 224)" font-family="monospace" font-size="12" fill="#22d3ee"><text x="0" y="0">$</text><text x="16" y="0">build useful things with code</text><rect x="213" y="-12" width="8" height="16" fill="#67e8f9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g>
</svg>